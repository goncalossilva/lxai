name: Archive lisbonai.xyz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Run archiver
        run: npm run archive

      - name: Preserve CNAME if it exists
        run: |
          # Fetch CNAME from gh-pages branch if it exists
          if git fetch origin gh-pages 2>/dev/null && git show origin/gh-pages:CNAME > /tmp/CNAME 2>/dev/null; then
            cp /tmp/CNAME ./output/CNAME
            echo "Preserved CNAME: $(cat ./output/CNAME)"
          else
            echo "No CNAME file found in gh-pages branch"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
